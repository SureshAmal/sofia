[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
sofia-content = { path = "crates/sofia_content" }
cpal = "0.17.3"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", features = ["sink"] }
gemini-live = { version = "0.1.9", features = ["vertex-auth"] }
gpui-kit = "0.7.1"
pulldown-cmark = "0.13.4"
livesofia = { path = "crates/livesofia" }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "recording"] }
rmcp = { version = "3.5.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sofia-config = { path = "crates/sofia_config" }
sofia-protocol = { path = "crates/sofia_protocol" }
sofia-ui-layer = { path = "crates/sofia_ui_layer" }
sofia-mcp-client = { path = "crates/sofia_mcp_client" }
sofia-trace-store = { path = "crates/sofia_trace_store" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[profile.dev]
opt-level = 0
debug = "limited"
codegen-units = 16
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.sofia-ui-layer]
opt-level = 2

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
