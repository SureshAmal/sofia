name: Build Sofia (Linux & Windows)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sofia-linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sofia-windows-x86_64
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/livesofia dist/
          cp target/${{ matrix.target }}/release/sofia-ui-layer dist/
          cp target/${{ matrix.target }}/release/sofia-setting dist/
          cp target/${{ matrix.target }}/release/sofia-trace dist/
          cp target/${{ matrix.target }}/release/sofia-mcp dist/
          cp target/${{ matrix.target }}/release/sofia-memory dist/
          cd dist && tar -czvf ../${{ matrix.artifact_name }}.tar.gz *

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/livesofia.exe" -Destination "dist/"
          Copy-Item "target/${{ matrix.target }}/release/sofia-ui-layer.exe" -Destination "dist/"
          Copy-Item "target/${{ matrix.target }}/release/sofia-setting.exe" -Destination "dist/"
          Copy-Item "target/${{ matrix.target }}/release/sofia-trace.exe" -Destination "dist/"
          Copy-Item "target/${{ matrix.target }}/release/sofia-mcp.exe" -Destination "dist/"
          Copy-Item "target/${{ matrix.target }}/release/sofia-memory.exe" -Destination "dist/"
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
